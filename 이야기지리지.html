<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 지리지</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg:#0B0C10;
    --bg-vignette:#101218;
    --surface:#14161C;
    --line:#262A34;
    --line-soft:#1D2028;
    --text:#F3F1E8;
    --text-dim:#8B8E9B;
    --text-faint:#5B5E6B;
    --teal:#2FF3C7;
    --teal-dim:#1B8F76;
    --amber:#F2A93B;
    --map-land:#E9DFC2;
    --map-land-dim:#3A3B33;
    --map-sea:#0E141B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 700px at 50% -10%, #1A1D26 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    min-height:100vh;
  }
  #app{
    max-width:1180px;
    margin:0 auto;
    padding:30px 24px 44px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:14px;
  }
  header .title-block h1{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:26px;
    margin:0 0 3px 0;
    letter-spacing:0.5px;
    color:var(--text);
  }
  header .title-block p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .map-toggle{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
  }
  .map-toggle button{
    background:transparent;
    border:none;
    padding:7px 16px;
    border-radius:16px;
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text-dim);
    cursor:pointer;
    transition:background .18s, color .18s;
  }
  .map-toggle button.active{
    background:var(--teal);
    color:#062019;
    font-weight:700;
  }
  .add-btn{
    background:transparent;
    color:var(--teal);
    border:1px solid var(--teal-dim);
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    transition:background .18s, color .18s;
  }
  .add-btn:hover{ background:rgba(47,243,199,0.12); }

  /* ---------- Main layout ---------- */
  .main{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:20px;
  }
  @media (max-width:800px){
    .main{ grid-template-columns:1fr; }
  }

  .map-panel{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 40%, #0F1620 0%, var(--map-sea) 70%);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    aspect-ratio:16/9;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
  }
  .map-panel.korea-mode{ aspect-ratio:4/5; }
  #mapSvg{ width:100%; height:100%; display:block; cursor:default; }
  #mapSvg.placing{ cursor:crosshair; }

  .placement-hint{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    background:var(--teal);
    color:#062019;
    font-size:12.5px;
    font-weight:700;
    padding:7px 16px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(47,243,199,.5);
  }
  .hidden{ display:none !important; }

  .pin{ cursor:pointer; }
  .pin circle.dot{ transition:r .12s; }
  .pin:hover circle.dot{ r:8; }
  .pin text{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:10.5px;
    fill:var(--text);
    pointer-events:none;
  }
  @keyframes pinPulse{
    0%{ opacity:0.55; r:9; }
    70%{ opacity:0; r:16; }
    100%{ opacity:0; r:16; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .year-hero{
    padding:2px 4px 6px;
  }
  .year-hero .year-num{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:52px;
    line-height:1;
    color:var(--text);
    text-shadow:0 0 22px rgba(47,243,199,.35);
  }
  .year-hero .era-name{
    font-size:12.5px;
    color:var(--teal);
    margin-top:6px;
    font-weight:500;
  }

  .divider-label{
    font-size:11.5px;
    color:var(--text-faint);
    letter-spacing:.3px;
    margin-bottom:6px;
  }
  .history-block{
    padding:14px 0;
    border-top:1px solid var(--line-soft);
  }
  .history-block .h-title{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;
  }
  .history-block .h-year{
    font-size:11.5px;
    font-weight:500;
    color:var(--teal);
    margin-right:6px;
  }
  .history-block.amber .h-year{ color:var(--amber); }
  .history-block .h-blurb{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
  }
  .history-block.amber .h-title{ color:var(--amber); }

  .works-block{
    border-top:1px solid var(--line-soft);
    padding-top:14px;
    flex:1;
    min-height:100px;
  }
  #worksList{ list-style:none; margin:0; padding:0; }
  #worksList li{
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13px;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:color .15s;
  }
  #worksList .w-main{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    min-width:0;
  }
  #worksList .w-main input[type=checkbox]{
    accent-color:var(--teal);
    width:15px; height:15px;
    flex-shrink:0;
    cursor:pointer;
  }
  #worksList .w-main span.w-title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:pointer;
  }
  #worksList .w-main span.w-title.read{
    color:var(--text-faint);
    text-decoration:line-through;
  }
  #readProgress{
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  #worksList li:last-child{ border-bottom:none; }
  #worksList .w-main:hover span.w-title{ color:var(--teal); }
  #worksList .empty-msg{
    color:var(--text-faint);
    font-size:12.5px;
    cursor:default;
  }
  #worksList .empty-msg:hover{ color:var(--text-faint); }
  #worksList .w-type{
    font-size:11px;
    color:var(--text-faint);
    flex-shrink:0;
    margin-left:8px;
  }

  /* ---------- Timeline (waveform) ---------- */
  .timeline{
    margin-top:24px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 22px 14px;
    position:relative;
  }
  .waveform{
    display:flex;
    align-items:flex-end;
    height:34px;
    gap:2px;
    margin-bottom:10px;
    pointer-events:none;
  }
  .waveform .bar{
    flex:1;
    background:var(--line);
    border-radius:1px;
    transition:background .15s;
  }
  .waveform .bar.past{ background:var(--teal-dim); }
  .slider-wrap{ position:relative; height:0; }
  #yearSlider{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    height:34px;
    background:transparent;
    outline:none;
    position:relative;
    top:-44px;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:44px;
    border-radius:3px;
    background:var(--teal);
    box-shadow:0 0 12px rgba(47,243,199,.7);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:14px; height:44px;
    border:none;
    border-radius:3px;
    background:var(--teal);
    box-shadow:0 0 12px rgba(47,243,199,.7);
    cursor:pointer;
  }
  #yearSlider::-moz-range-track{ background:transparent; height:44px; }
  .era-ticks{
    position:relative;
    height:18px;
    font-size:11px;
    color:var(--text-faint);
  }
  .era-ticks span{
    position:absolute;
    transform:translateX(-50%);
    white-space:nowrap;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(4,5,7,.72);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    padding:24px 26px 22px;
  }
  .modal h2{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 18px 0;
    color:var(--text);
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 11px;
    font-size:13.5px;
    font-family:'Noto Sans KR',sans-serif;
    background:#0F1116;
    color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;
    border-color:var(--teal-dim);
  }
  .field textarea{ resize:vertical; min-height:52px; }
  .row2{ display:flex; gap:8px; }
  .row2 > div{ flex:1; }
  .year-input-group{ display:flex; gap:6px; }
  .year-input-group input{ flex:2; }
  .year-input-group select{ flex:1; }
  .year-input-group.auto-high input{ border-color:var(--teal-dim); box-shadow:0 0 0 1px var(--teal-dim) inset; }
  .year-input-group.auto-low input{ border-color:#8A6A2E; box-shadow:0 0 0 1px #8A6A2E inset; }
  .field-with-btn{ display:flex; gap:8px; }
  .field-with-btn input{ flex:1; }
  .search-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--teal-dim);
    color:var(--teal);
    border-radius:6px;
    padding:0 14px;
    font-size:12.5px;
    font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  .search-btn:hover{ background:rgba(47,243,199,.1); }
  .search-btn:disabled{ opacity:.5; cursor:default; }
  #autoSearchStatus{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:6px;
    min-height:14px;
  }
  #autoSearchPreview{
    font-size:12.5px;
    line-height:1.55;
    color:var(--text-dim);
    background:#0F1116;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    margin-top:6px;
    max-height:140px;
    overflow-y:auto;
  }
  #autoSearchPreview:empty{ display:none; }
    width:100%;
    background:#0F1116;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:10px;
    font-size:13px;
    cursor:pointer;
    color:var(--text-dim);
    font-family:'Noto Sans KR',sans-serif;
  }
  .place-btn.set{ background:rgba(47,243,199,.1); color:var(--teal); border:1px solid var(--teal-dim); }
  .modal-actions{
    display:flex; gap:8px; margin-top:20px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    border:1px solid var(--line);
  }
  .btn-cancel{ background:transparent; color:var(--text-dim); }
  .btn-save{ background:var(--teal); color:#062019; border-color:var(--teal); font-weight:700; }
  .btn-danger{ background:transparent; color:#E15B5B; border-color:#5A2E2E; }
  .field-error{ font-size:11.5px; color:#E15B5B; margin-top:5px; display:none; }

  /* ---------- Detail panel ---------- */
  .detail-period{
    display:inline-block;
    background:rgba(47,243,199,.1);
    border:1px solid var(--teal-dim);
    border-radius:20px;
    padding:4px 12px;
    font-size:12px;
    color:var(--teal);
    margin-bottom:12px;
  }
  .detail-loc{ font-size:13px; color:var(--text-dim); margin-bottom:10px; }
  .detail-note{ font-size:13.5px; line-height:1.65; color:var(--text); margin-bottom:18px; }
  .detail-creator{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="title-block">
      <h1>이야기 지리지</h1>
      <p>문학과 영화 속 시공간을, 세계사·한국사 위에 놓다</p>
    </div>
    <div class="controls">
      <div class="map-toggle">
        <button id="btnWorldMap" class="active">세계지도</button>
        <button id="btnKoreaMap">한국지도</button>
      </div>
      <button class="add-btn" id="openAddBtn">+ 작품 추가</button>
    </div>
  </header>

  <div class="main">
    <div class="map-panel" id="mapPanel">
      <svg id="mapSvg" viewBox="0 0 1000 500"></svg>
      <div class="placement-hint hidden" id="placementHint">지도를 클릭해 위치를 지정하세요</div>
    </div>

    <div class="sidebar">
      <div class="year-hero">
        <div class="year-num" id="yearNum">1400</div>
        <div class="era-name" id="eraName"></div>
      </div>

      <div>
        <div class="history-block">
          <div class="divider-label">세계사</div>
          <div class="h-title" id="worldHTitle"></div>
          <div class="h-blurb" id="worldHBlurb"></div>
        </div>
        <div class="history-block amber">
          <div class="divider-label">한국사</div>
          <div class="h-title" id="koreaHTitle"></div>
          <div class="h-blurb" id="koreaHBlurb"></div>
        </div>
      </div>

      <div class="works-block">
        <div class="divider-label">이 시대의 작품</div>
        <div id="readProgress"></div>
        <ul id="worksList"></ul>
      </div>
    </div>
  </div>

  <div class="timeline">
    <div class="waveform" id="waveform"></div>
    <div class="slider-wrap">
      <input type="range" id="yearSlider" min="-3000" max="2026" value="1400" step="1">
    </div>
    <div class="era-ticks" id="eraTicks"></div>
  </div>

</div>

<!-- Add work modal -->
<div class="modal-overlay hidden" id="addOverlay">
  <div class="modal">
    <h2>새 작품 추가</h2>
    <div class="field">
      <label>제목</label>
      <div class="field-with-btn">
        <input type="text" id="fTitle" placeholder="예: 메밀꽃 필 무렵">
        <button type="button" class="search-btn" id="autoSearchBtn">🔍 자동 검색</button>
      </div>
      <div id="autoSearchStatus"></div>
      <div id="autoSearchPreview"></div>
    </div>
    <div class="field">
      <label>유형</label>
      <select id="fType">
        <option>소설</option>
        <option>시</option>
        <option>희곡</option>
        <option>영화</option>
        <option>드라마</option>
        <option>수필/일기</option>
        <option>기타</option>
      </select>
    </div>
    <div class="field">
      <label>지은이 / 감독</label>
      <input type="text" id="fCreator" placeholder="예: 이효석">
    </div>
    <div class="field">
      <label>배경 시작 연도</label>
      <div class="year-input-group" id="fYearStartGroup">
        <input type="number" id="fYearStart" placeholder="예: 1925">
        <select id="fYearStartEra"><option value="AD">서기(AD)</option><option value="BC">기원전(BC)</option></select>
      </div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="fHasEnd" style="width:auto;margin-right:6px;">종료 연도가 따로 있음</label>
      <div class="year-input-group" id="fYearEndGroup" style="margin-top:6px;display:none;">
        <input type="number" id="fYearEnd" placeholder="예: 1953">
        <select id="fYearEndEra"><option value="AD">서기(AD)</option><option value="BC">기원전(BC)</option></select>
      </div>
    </div>
    <div class="field">
      <label>배경 장소</label>
      <div class="field-with-btn">
        <input type="text" id="fLocation" placeholder="예: 강원도 영월 청령포">
        <button type="button" class="search-btn" id="geoSearchBtn">📍 위치 찾기</button>
      </div>
      <div id="geoSearchStatus" style="font-size:11.5px;color:var(--text-dim);margin-top:6px;min-height:14px;"></div>
    </div>
    <div class="field">
      <button type="button" class="place-btn" id="fPlaceBtn">지도에서 직접 위치 조정하기 (선택)</button>
      <div class="field-error" id="fCoordError">배경 장소로 위치를 찾거나, 지도를 클릭해 위치를 지정해주세요.</div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fNote" placeholder="이 작품을 왜 여기 두는지, 짧은 메모"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="fCancelBtn">취소</button>
      <button class="btn-save" id="fSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay hidden" id="detailOverlay">
  <div class="modal" id="detailModalBody"></div>
</div>

<script>
(function(){

  // ---------------- Static reference data ----------------
  var MIN_YEAR = -3000, MAX_YEAR = 2026;

  var WORLD_ERAS = [
    {year:-3000, label:'선사·고대 문명'},
    {year:-800,  label:'고대'},
    {year:500,   label:'중세'},
    {year:1500,  label:'근세'},
    {year:1800,  label:'근대'},
    {year:1945,  label:'현대'}
  ];
  var KOREA_ERAS = [
    {year:-2333, label:'고조선'},
    {year:-100,  label:'삼국시대'},
    {year:668,   label:'남북국시대'},
    {year:918,   label:'고려'},
    {year:1392,  label:'조선'},
    {year:1910,  label:'일제강점기'},
    {year:1945,  label:'현대'}
  ];

  var WORLD_HISTORY = [
    {year:-3000, title:'메소포타미아·이집트 문명', blurb:'수메르 도시국가와 이집트 초기 왕조가 형성되던 시기.'},
    {year:-1200, title:'지중해 청동기 문명 말기', blurb:'트로이 전쟁의 배경이 되는 청동기 시대 후기.'},
    {year:-500,  title:'그리스 고전기', blurb:'아테네 민주정과 페르시아 전쟁의 시대.'},
    {year:-27,   title:'로마 제국 성립', blurb:'아우구스투스가 로마 제정을 열다.'},
    {year:313,   title:'기독교 공인', blurb:'로마 제국이 기독교를 받아들이기 시작하다.'},
    {year:476,   title:'서로마 제국 멸망', blurb:'유럽 중세의 시작으로 보는 분기점.'},
    {year:800,   title:'카롤루스 대관', blurb:'서유럽 중세 왕권 질서가 형성되다.'},
    {year:1096,  title:'십자군 전쟁 시작', blurb:'유럽과 이슬람 세계가 충돌하다.'},

  function migrateKoreaCoords(works){
    var changed = false;
    works.forEach(function(w){
      var m = KOREA_COORD_MIGRATION_V1[w.id];
      if(m && w.x === m.old.x && w.y === m.old.y){
        w.x = m.now.x; w.y = m.now.y;
        changed = true;
      }
    });
    return changed;
  }

  var STORAGE_KEY = 'storyatlas:works';

  // 클로드 아티팩트 안에서는 window.storage를, GitHub 등 바깥 호스팅에서는
  // 브라우저 localStorage를 자동으로 사용하는 저장소 어댑터
  var storageAdapter = {
    hasClaudeStorage: (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function'),
    async get(key){
      if(this.hasClaudeStorage){
        return await window.storage.get(key, false);
      }
      var v = localStorage.getItem(key);
      if(v === null) throw new Error('키가 존재하지 않음');
      return {key:key, value:v, shared:false};
    },
    async set(key, value){
      if(this.hasClaudeStorage){
        return await window.storage.set(key, value, false);
      }
      localStorage.setItem(key, value);
      return {key:key, value:value, shared:false};
    }
  };

  // ---------------- Storage ----------------
  async function loadWorks(){
    try{
      var res = await storageAdapter.get(STORAGE_KEY);
      state.works = res && res.value ? JSON.parse(res.value) : SEED_WORKS.slice();
    }catch(e){
      state.works = SEED_WORKS.slice();
    }
    // 새로 추가된 고전 작품 중, 이미 있는 것(id 기준)은 건너뛰고 없는 것만 병합
    var existingIds = {};
    state.works.forEach(function(w){ existingIds[w.id] = true; });
    [CLASSIC_ADDITIONS, ADDITIONS_V2].forEach(function(list){
      list.forEach(function(w){
        if(!existingIds[w.id]){
          state.works.push(w);
          existingIds[w.id] = true;
        }
      });
    });
    migrateKoreaCoords(state.works);
    try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state.works)); }catch(e2){}
    renderAll();
  }
  async function saveWorks(){
    try{
      await storageAdapter.set(STORAGE_KEY, JSON.stringify(state.works));
    }catch(e){
      console.error('저장 실패', e);
    }
  }

  // ---------------- Helpers ----------------
  function formatYear(y){
    if(y < 0) return '기원전 ' + Math.abs(y) + '년';
    return y + '년';
  }
  function periodLabel(work){
    if(work.yearEnd && work.yearEnd !== work.yearStart){
      return formatYear(work.yearStart) + ' ~ ' + formatYear(work.yearEnd);
    }
    return formatYear(work.yearStart) + ' 무렵';
  }
  function eraForYear(list, year){
    var found = list[0];
    for(var i=0;i<list.length;i++){
      if(list[i].year <= year) found = list[i];
    }
    return found;
  }
  function historyContextForYear(list, year){
    var found = list[0];
    for(var i=0;i<list.length;i++){
      if(list[i].year <= year) found = list[i];
    }
    return found;
  }
  function isActive(work, year){
    var start = work.yearStart, end = (work.yearEnd!=null? work.yearEnd : work.yearStart);
    return year >= (start-15) && year <= (end+15);
  }
  function pct(year){
    return (year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  }

  function buildSvg(){
    var svg = document.getElementById('mapSvg');
    svg.innerHTML = '';
    var isWorld = state.currentMap === 'world';
    svg.setAttribute('viewBox', isWorld ? '0 0 1000 500' : '0 0 400 600');
    document.getElementById('mapPanel').classList.toggle('korea-mode', !isWorld);

    var ns = 'http://www.w3.org/2000/svg';

    var defs = document.createElementNS(ns,'defs');
    var filter = document.createElementNS(ns,'filter');
    filter.setAttribute('id','landGlow');
    filter.setAttribute('x','-40%'); filter.setAttribute('y','-40%');
    filter.setAttribute('width','180%'); filter.setAttribute('height','180%');
    var blur = document.createElementNS(ns,'feGaussianBlur');
    blur.setAttribute('stdDeviation','3');
    blur.setAttribute('result','blur');
    filter.appendChild(blur);
    var merge = document.createElementNS(ns,'feMerge');
    var m1 = document.createElementNS(ns,'feMergeNode'); m1.setAttribute('in','blur');
    var m2 = document.createElementNS(ns,'feMergeNode'); m2.setAttribute('in','SourceGraphic');
    merge.appendChild(m1); merge.appendChild(m2);
    filter.appendChild(merge);
    defs.appendChild(filter);
    svg.appendChild(defs);

    // faint lat/long grid
    var gridGroup = document.createElementNS(ns,'g');
    gridGroup.setAttribute('stroke', '#1B2530');
    gridGroup.setAttribute('stroke-width','0.6');
    var w = isWorld?1000:400, h = isWorld?500:600;
    var step = isWorld?100:75;
    for(var gx=0; gx<=w; gx+=step){
      var l1 = document.createElementNS(ns,'line');
      l1.setAttribute('x1',gx); l1.setAttribute('y1',0);
      l1.setAttribute('x2',gx); l1.setAttribute('y2',h);
      gridGroup.appendChild(l1);
    }
    for(var gy=0; gy<=h; gy+=step){
      var l2 = document.createElementNS(ns,'line');
      l2.setAttribute('x1',0); l2.setAttribute('y1',gy);
      l2.setAttribute('x2',w); l2.setAttribute('y2',gy);
      gridGroup.appendChild(l2);
    }
    svg.appendChild(gridGroup);

    // land (glowing parchment against dark sea)
    var landPaths = isWorld ? WORLD_LAND : KOREA_LAND;
    var landGroup = document.createElementNS(ns,'g');
    landGroup.setAttribute('filter','url(#landGlow)');
    landPaths.forEach(function(d){
      var p = document.createElementNS(ns,'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', 'var(--map-land)');
      p.setAttribute('fill-opacity','0.14');
      p.setAttribute('stroke', 'var(--map-land)');
      p.setAttribute('stroke-width', '1.3');
      p.setAttribute('stroke-opacity','0.85');
      p.setAttribute('stroke-linejoin','round');
      landGroup.appendChild(p);
    });
    if(!isWorld){
      var jeju = document.createElementNS(ns,'circle');
      jeju.setAttribute('cx', KOREA_JEJU.x);
      jeju.setAttribute('cy', KOREA_JEJU.y);
      jeju.setAttribute('r', KOREA_JEJU.r);
      jeju.setAttribute('fill','var(--map-land)');
      jeju.setAttribute('fill-opacity','0.14');
      jeju.setAttribute('stroke','var(--map-land)');
      jeju.setAttribute('stroke-opacity','0.85');
      jeju.setAttribute('stroke-width','1.3');
      landGroup.appendChild(jeju);
    }
    svg.appendChild(landGroup);

    // labels
    var labels = isWorld ? WORLD_LABELS : KOREA_LABELS;
    labels.forEach(function(lb){
      var t = document.createElementNS(ns,'text');
      t.setAttribute('x', lb.x); t.setAttribute('y', lb.y);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size', isWorld?11:10.5);
      t.setAttribute('fill', '#6A6E7A');
      t.setAttribute('font-family',"'Noto Sans KR',sans-serif");
      t.textContent = lb.t;
      svg.appendChild(t);
    });

    svg.onclick = function(evt){
      if(!state.placing) return;
      var rect = svg.getBoundingClientRect();
      var vb = svg.viewBox.baseVal;
      var x = (evt.clientX - rect.left) / rect.width * vb.width;
      var y = (evt.clientY - rect.top) / rect.height * vb.height;
      state.pendingCoord = {x: Math.round(x), y: Math.round(y), map: state.currentMap};
      var btn = document.getElementById('fPlaceBtn');
      btn.textContent = '위치 지정됨 · 다시 클릭해 변경';
      btn.classList.add('set');
      document.getElementById('fCoordError').style.display = 'none';
      state.placing = false;
      svg.classList.remove('placing');
      document.getElementById('placementHint').classList.add('hidden');
    };

    renderPins();
  }

  function renderPins(){
    var svg = document.getElementById('mapSvg');
    var old = svg.querySelectorAll('.pin');
    old.forEach(function(n){ n.remove(); });
    var ns = 'http://www.w3.org/2000/svg';
    var worksOnMap = state.works.filter(function(w){ return w.map === state.currentMap; });

    worksOnMap.forEach(function(w){
      var active = isActive(w, state.year);
      var g = document.createElementNS(ns,'g');
      g.setAttribute('class','pin');
      g.setAttribute('transform', 'translate('+w.x+','+w.y+')');

      if(active){
        var ring = document.createElementNS(ns,'circle');
        ring.setAttribute('r','9');
        ring.setAttribute('fill','none');
        ring.setAttribute('stroke','var(--teal)');
        ring.setAttribute('stroke-width','1.5');
        ring.style.animation = 'pinPulse 2.2s ease-out infinite';
        g.appendChild(ring);
      }

      var c = document.createElementNS(ns,'circle');
      c.setAttribute('class','dot');
      c.setAttribute('r', active ? 5.5 : 3);
      c.setAttribute('fill', active ? 'var(--teal)' : '#4A4D57');
      c.setAttribute('opacity', active? '1':'0.6');
      if(active){ c.style.filter = 'drop-shadow(0 0 6px rgba(47,243,199,.9))'; }
      g.appendChild(c);

        var t = document.createElementNS(ns,'text');
        t.setAttribute('x', 10);
        t.setAttribute('y', 4);
        t.textContent = w.title;
        g.appendChild(t);
      }

      g.onclick = function(evt){

      };
      svg.appendChild(g);
    });

  function renderWaveform(){
    var box = document.getElementById('waveform');
    box.innerHTML = '';
    var barCount = 90;
    var curPct = pct(state.year);
    // deterministic pseudo-random heights (seeded by index) for a stable waveform look
    for(var i=0;i<barCount;i++){
      var seed = Math.sin(i*12.9898)*43758.5453;
      var frac = seed - Math.floor(seed);
      var h = 6 + frac*26;
      var bar = document.createElement('div');
      bar.className = 'bar' + ((i/barCount*100) <= curPct ? ' past' : '');
      bar.style.height = h + 'px';
      box.appendChild(bar);
    }
  }

  // ---------------- 배경 장소 자동 위치 찾기 (OpenStreetMap Nominatim, API 키 불필요) ----------------
  // 세계지도는 실제 위도경도를 그대로 정사도법으로 옮긴 것이라 계산이 정확함
  function latLonToWorldXY(lat, lon){
    return { x: (lon + 180) / 360 * 1000, y: (90 - lat) / 180 * 500 };
  }
  // 한국지도도 이제 세계지도와 같은 방식(실제 위도경도 선형 투영)으로 그려져 있어서
  // 지오코딩 결과를 그대로 정확하게 변환할 수 있음
  function latLonToKoreaXY(lat, lon){
    var LON_MIN = 124.2, LON_MAX = 131.2, LAT_MIN = 32.8, LAT_MAX = 44.3;
    var x = (lon - LON_MIN) / (LON_MAX - LON_MIN) * 400;
    var y = (LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * 600;
    return { x: x, y: y };
  }

  async function runGeoSearch(){
    var query = document.getElementById('fLocation').value.trim();
    var statusEl = document.getElementById('geoSearchStatus');
    var btn = document.getElementById('geoSearchBtn');
    if(!query){ statusEl.textContent = '배경 장소를 먼저 입력해주세요.'; return; }

    btn.disabled = true;
    statusEl.textContent = '위치 찾는 중...';

    try{
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=ko&q='
        + encodeURIComponent(query);
      var results = await fetch(url).then(function(r){ return r.json(); });

      if(!results || results.length === 0){
        statusEl.textContent = '위치를 찾지 못했어요. 직접 지도를 클릭해 지정해주세요.';
        btn.disabled = false;
        return;
      }

      var item = results[0];
      var lat = parseFloat(item.lat), lon = parseFloat(item.lon);
      var countryCode = item.address && item.address.country_code;
      var isKorea = (countryCode === 'kr' || countryCode === 'kp');
      var targetMap = isKorea ? 'korea' : 'world';
      var xy = isKorea ? latLonToKoreaXY(lat, lon) : latLonToWorldXY(lat, lon);
      var maxX = isKorea ? 400 : 1000, maxY = isKorea ? 600 : 500;
      var x = Math.round(Math.min(Math.max(xy.x, 0), maxX));
      var y = Math.round(Math.min(Math.max(xy.y, 0), maxY));

      state.pendingCoord = { x: x, y: y, map: targetMap };

      if(state.currentMap !== targetMap){
        state.currentMap = targetMap;
        document.getElementById('btnWorldMap').classList.toggle('active', targetMap === 'world');
        document.getElementById('btnKoreaMap').classList.toggle('active', targetMap === 'korea');
        renderAll();
      }

      var btnPlace = document.getElementById('fPlaceBtn');
      btnPlace.textContent = '위치 찾음 · 지도에서 다시 클릭해 조정 가능';
      btnPlace.classList.add('set');
      document.getElementById('fCoordError').style.display = 'none';

      statusEl.textContent = '📍 ' + (item.display_name.split(',').slice(0,2).join(', '))
        + ' 부근으로 지정했어요 (' + (isKorea?'한국지도':'세계지도') + '). 위치가 어색하면 지도를 클릭해 조정해주세요.';
    }catch(err){
      console.error(err);
      statusEl.textContent = '검색 중 오류가 발생했어요. 직접 지도를 클릭해 지정해주세요.';
    }
    btn.disabled = false;
  }

  function signedYear(val, era){
    var n = parseInt(val, 10);
    if(isNaN(n)) return null;
    return era === 'BC' ? -Math.abs(n) : Math.abs(n);
  }

  // ---------------- 자동 검색 (위키데이터 + 위키백과, API 키 불필요) ----------------
  function wdFirstEntityId(claims, prop){
    if(!claims[prop] || !claims[prop][0]) return null;
    var snak = claims[prop][0].mainsnak;
    if(!snak || !snak.datavalue) return null;
    return snak.datavalue.value.id || null;
  }
  function wdFirstYear(claims, prop){
    if(!claims[prop] || !claims[prop][0]) return null;
    var snak = claims[prop][0].mainsnak;
    if(!snak || !snak.datavalue) return null;
    var timeStr = snak.datavalue.value.time;
    var m = /^([+-])(\d+)-/.exec(timeStr || '');
    if(!m) return null;
    return (m[1] === '-' ? -1 : 1) * parseInt(m[2], 10);
  }
  function wdAllEntityIds(claims, prop){
    if(!claims[prop]) return [];
    return claims[prop].map(function(c){
      var dv = c.mainsnak && c.mainsnak.datavalue;
      return dv ? dv.value.id : null;
    }).filter(function(v){ return !!v; });
  }
  // 위키데이터 "무엇으로 분류되는가"(instance of, P31) 값을 우리 앱의 유형 옵션으로 매핑
  var TYPE_QID_MAP = {
    'Q11424': '영화',        // film
    'Q506240': '영화',       // television film
    'Q5398426': '드라마',    // television series
    'Q1259759': '드라마',    // miniseries
    'Q8261': '소설',         // novel
    'Q25379': '희곡',        // play
    'Q5185279': '시',        // poem
    'Q35760': '수필/일기'    // essay
  };

  async function runAutoSearch(){
    var title = document.getElementById('fTitle').value.trim();
    var statusEl = document.getElementById('autoSearchStatus');
    var previewEl = document.getElementById('autoSearchPreview');
    var btn = document.getElementById('autoSearchBtn');
    if(!title){ statusEl.textContent = '제목을 먼저 입력해주세요.'; return; }

    btn.disabled = true;
    statusEl.textContent = '검색 중...';
    previewEl.innerHTML = '';

    try{
      var searchUrl = 'https://www.wikidata.org/w/api.php?action=wbsearchentities&search='
        + encodeURIComponent(title) + '&language=ko&uselang=ko&type=item&limit=1&format=json&origin=*';
      var searchData = await fetch(searchUrl).then(function(r){ return r.json(); });

      if(!searchData.search || searchData.search.length === 0){
        statusEl.textContent = '위키데이터에서 찾지 못했어요. 직접 입력해주세요.';
        btn.disabled = false;
        return;
      }
      var qid = searchData.search[0].id;

      var entityUrl = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + qid
        + '&props=claims|sitelinks&languages=ko&format=json&origin=*';
      var entityData = await fetch(entityUrl).then(function(r){ return r.json(); });
      var entity = entityData.entities[qid];
      var claims = entity.claims || {};

      var creatorQid = wdFirstEntityId(claims,'P57') || wdFirstEntityId(claims,'P50') || wdFirstEntityId(claims,'P58');
      var locationQid = wdFirstEntityId(claims,'P840') || wdFirstEntityId(claims,'P276');
      var pubYear = wdFirstYear(claims,'P577');
      if(pubYear === null) pubYear = wdFirstYear(claims,'P571');
      var periodQid = wdFirstEntityId(claims,'P2408'); // "배경이 된 시대"(set in period)

      var periodLabel = null, periodStart = null, periodEnd = null;
      if(periodQid){
        try{
          var periodUrl = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + periodQid
            + '&props=labels|claims&languages=ko|en&format=json&origin=*';
          var periodData = await fetch(periodUrl).then(function(r){ return r.json(); });
          var periodEnt = periodData.entities[periodQid];
          if(periodEnt){
            var lab = periodEnt.labels && (periodEnt.labels.ko || periodEnt.labels.en);
            periodLabel = lab ? lab.value : null;
            periodStart = wdFirstYear(periodEnt.claims || {}, 'P580');
            periodEnd = wdFirstYear(periodEnt.claims || {}, 'P582');
          }
        }catch(e2){ /* 배경 시대 조회 실패는 무시하고 발표연도로 대체 */ }
      }

      var idsToResolve = [creatorQid, locationQid].filter(function(v){ return !!v; });
      var labels = {};
      if(idsToResolve.length > 0){
        var labelUrl = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids='
          + idsToResolve.join('|') + '&props=labels&languages=ko|en&format=json&origin=*';
        var labelData = await fetch(labelUrl).then(function(r){ return r.json(); });
        idsToResolve.forEach(function(id){
          var ent = labelData.entities[id];
          var lab = ent && ent.labels && (ent.labels.ko || ent.labels.en);
          labels[id] = lab ? lab.value : null;
        });
      }

      var filled = [];

      var instanceIds = wdAllEntityIds(claims, 'P31');
      var matchedType = null;
      for(var ti=0; ti<instanceIds.length; ti++){
        if(TYPE_QID_MAP[instanceIds[ti]]){ matchedType = TYPE_QID_MAP[instanceIds[ti]]; break; }
      }
      if(matchedType){
        document.getElementById('fType').value = matchedType;
        filled.push('유형(' + matchedType + ')');
      }

      if(creatorQid && labels[creatorQid] && !document.getElementById('fCreator').value.trim()){
        document.getElementById('fCreator').value = labels[creatorQid];
        filled.push('지은이/감독');
      }

      var startGroup = document.getElementById('fYearStartGroup');
      var endGroup = document.getElementById('fYearEndGroup');
      startGroup.classList.remove('auto-high','auto-low');
      endGroup.classList.remove('auto-high','auto-low');

      if(periodStart !== null){
        // 배경 시대 정보를 찾음 — 신뢰도 높음
        document.getElementById('fYearStart').value = Math.abs(periodStart);
        document.getElementById('fYearStartEra').value = periodStart < 0 ? 'BC' : 'AD';
        startGroup.classList.add('auto-high');
        if(periodEnd !== null && periodEnd !== periodStart){
          document.getElementById('fHasEnd').checked = true;
          document.getElementById('fYearEnd').value = Math.abs(periodEnd);
          document.getElementById('fYearEndEra').value = periodEnd < 0 ? 'BC' : 'AD';
          endGroup.style.display = 'flex';
          endGroup.classList.add('auto-high');
        }
        filled.push('배경 연도 (' + (periodLabel || '위키데이터 등록 시대') + ' 기준, 신뢰도 높음)');
      }else if(pubYear !== null){
        // 배경 시대 정보가 없어 발표연도로 대체 — 신뢰도 낮음
        document.getElementById('fYearStart').value = Math.abs(pubYear);
        document.getElementById('fYearStartEra').value = pubYear < 0 ? 'BC' : 'AD';
        startGroup.classList.add('auto-low');
        filled.push('연도 (발표·개봉연도로 대체, ⚠️ 배경 연도와 다를 수 있음)');
      }

      if(locationQid && labels[locationQid] && !document.getElementById('fLocation').value.trim()){
        document.getElementById('fLocation').value = labels[locationQid];
        filled.push('배경 장소');
      }

      statusEl.textContent = filled.length > 0
        ? ('자동으로 채웠어요 — ' + filled.join(' · '))
        : '위키데이터에 세부 정보가 부족해요. 아래 요약을 참고해서 직접 입력해주세요.';

      var sitelinks = entity.sitelinks || {};
      var wikiTitle = null, wikiLang = null;
      if(sitelinks.kowiki){ wikiTitle = sitelinks.kowiki.title; wikiLang = 'ko'; }
      else if(sitelinks.enwiki){ wikiTitle = sitelinks.enwiki.title; wikiLang = 'en'; }

      if(wikiTitle){
        var sumUrl = 'https://' + wikiLang + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(wikiTitle);
        var sumData = await fetch(sumUrl).then(function(r){ return r.json(); });
        if(sumData.extract){
          var p = document.createElement('p');
          p.style.margin = '0';
          p.textContent = sumData.extract;
          previewEl.appendChild(p);
          if(sumData.content_urls && sumData.content_urls.desktop){
            var a = document.createElement('a');
            a.href = sumData.content_urls.desktop.page;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = '위키백과에서 더 보기 →';
            a.style.color = 'var(--teal)';
            a.style.fontSize = '12px';
            a.style.display = 'inline-block';
            a.style.marginTop = '8px';
            previewEl.appendChild(a);
          }
        }
      }
    }catch(err){
      console.error(err);
      statusEl.textContent = '검색 중 오류가 발생했어요 (네트워크 문제일 수 있어요). 직접 입력해주세요.';
    }
    btn.disabled = false;
  }

  async function handleSave(){
    var title = document.getElementById('fTitle').value.trim();
    var type = document.getElementById('fType').value;
    var creator = document.getElementById('fCreator').value.trim();
    var yearStart = signedYear(document.getElementById('fYearStart').value, document.getElementById('fYearStartEra').value);
    var hasEnd = document.getElementById('fHasEnd').checked;
    var yearEnd = hasEnd ? signedYear(document.getElementById('fYearEnd').value, document.getElementById('fYearEndEra').value) : null;
    var location = document.getElementById('fLocation').value.trim();
    var note = document.getElementById('fNote').value.trim();

    if(!state.pendingCoord){
      document.getElementById('fCoordError').style.display = 'block';
      document.getElementById('fCoordError').textContent = '지도를 클릭해 위치를 먼저 찍어주세요.';
      return;
    }
    if(!title){ alert('제목을 입력해주세요.'); return; }
    if(yearStart === null){ alert('배경 시작 연도를 입력해주세요.'); return; }

    var w = {
      id: 'w' + Date.now(),
      map: state.pendingCoord.map,
      title: title,
      type: type,
      creator: creator,
      yearStart: yearStart,
      yearEnd: yearEnd,
      location: location,
      note: note,
      x: state.pendingCoord.x,
      y: state.pendingCoord.y
    };
    state.works.push(w);
    await saveWorks();
    closeAddModal();
    renderAll();
  }

  // ---------------- Event wiring ----------------
  document.getElementById('btnWorldMap').onclick = function(){
    state.currentMap = 'world';
    this.classList.add('active');
    document.getElementById('btnKoreaMap').classList.remove('active');
    renderAll();
  };
  document.getElementById('btnKoreaMap').onclick = function(){
    state.currentMap = 'korea';
    this.classList.add('active');
    document.getElementById('btnWorldMap').classList.remove('active');
    renderAll();
  };
  document.getElementById('yearSlider').oninput = function(){
    state.year = parseInt(this.value, 10);
    renderSidebar();
    renderPins();
    renderWaveform();
  };
  document.getElementById('openAddBtn').onclick = openAddModal;
  document.getElementById('autoSearchBtn').onclick = runAutoSearch;
  document.getElementById('geoSearchBtn').onclick = runGeoSearch;
  document.getElementById('fCancelBtn').onclick = closeAddModal;
  document.getElementById('fSaveBtn').onclick = handleSave;
  document.getElementById('fHasEnd').onchange = function(){
    document.getElementById('fYearEndGroup').style.display = this.checked ? 'flex' : 'none';
  };
  document.getElementById('fPlaceBtn').onclick = function(){
    state.placing = true;
    document.getElementById('mapSvg').classList.add('placing');
    document.getElementById('placementHint').classList.remove('hidden');
    document.getElementById('addOverlay').classList.add('hidden');
  };
  document.getElementById('mapSvg').addEventListener('click', function(){
    if(state.pendingCoord && !state.placing){
      document.getElementById('addOverlay').classList.remove('hidden');
    }
  });
  document.getElementById('detailOverlay').onclick = function(e){
    if(e.target === this) closeDetail();
  };
  document.getElementById('addOverlay').onclick = function(e){
    if(e.target === this && !state.placing) closeAddModal();
  };

  // init
  loadWorks();

})();
</script>
</body>
</html>
