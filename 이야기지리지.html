<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 지리지</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg:#0B0C10;
    --bg-vignette:#101218;
    --surface:#14161C;
    --line:#262A34;
    --line-soft:#1D2028;
    --text:#F3F1E8;
    --text-dim:#8B8E9B;
    --text-faint:#5B5E6B;
    --teal:#2FF3C7;
    --teal-dim:#1B8F76;
    --amber:#F2A93B;
    --map-land:#E9DFC2;
    --map-land-dim:#3A3B33;
    --map-sea:#0E141B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 700px at 50% -10%, #1A1D26 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    min-height:100vh;
  }
  #app{
    max-width:1180px;
    margin:0 auto;
    padding:30px 24px 44px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:20px;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:14px;
  }
  header .title-block h1{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:26px;
    margin:0 0 3px 0;
    letter-spacing:0.5px;
    color:var(--text);
  }
  header .title-block p{
    margin:0;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .map-toggle{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
  }
  .map-toggle button{
    background:transparent;
    border:none;
    padding:7px 16px;
    border-radius:16px;
    font-family:'Noto Sans KR',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text-dim);
    cursor:pointer;
    transition:background .18s, color .18s;
  }
  .map-toggle button.active{
    background:var(--teal);
    color:#062019;
    font-weight:700;
  }
  .add-btn{
    background:transparent;
    color:var(--teal);
    border:1px solid var(--teal-dim);
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    transition:background .18s, color .18s;
  }
  .add-btn:hover{ background:rgba(47,243,199,0.12); }

  /* ---------- Main layout ---------- */
  .main{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:20px;
  }
  @media (max-width:800px){
    .main{ grid-template-columns:1fr; }
  }

  .map-panel{
    position:relative;
    background:
      radial-gradient(ellipse at 50% 40%, #0F1620 0%, var(--map-sea) 70%);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    aspect-ratio:16/9;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
  }
  .map-panel.korea-mode{ aspect-ratio:4/5; }
  #mapSvg{ width:100%; height:100%; display:block; cursor:default; }
  #mapSvg.placing{ cursor:crosshair; }

  .placement-hint{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    background:var(--teal);
    color:#062019;
    font-size:12.5px;
    font-weight:700;
    padding:7px 16px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(47,243,199,.5);
  }
  .hidden{ display:none !important; }

  .pin{ cursor:pointer; }
  .pin circle.dot{ transition:r .12s; }
  .pin:hover circle.dot{ r:8; }
  .pin text{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:10.5px;
    fill:var(--text);
    pointer-events:none;
  }
  @keyframes pinPulse{
    0%{ opacity:0.55; r:9; }
    70%{ opacity:0; r:16; }
    100%{ opacity:0; r:16; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .year-hero{
    padding:2px 4px 6px;
  }
  .year-hero .year-num{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:52px;
    line-height:1;
    color:var(--text);
    text-shadow:0 0 22px rgba(47,243,199,.35);
  }
  .year-hero .era-name{
    font-size:12.5px;
    color:var(--teal);
    margin-top:6px;
    font-weight:500;
  }

  .divider-label{
    font-size:11.5px;
    color:var(--text-faint);
    letter-spacing:.3px;
    margin-bottom:6px;
  }
  .history-block{
    padding:14px 0;
    border-top:1px solid var(--line-soft);
  }
  .history-block .h-title{
    font-size:14px;
    font-weight:700;
    color:var(--text);
    margin-bottom:4px;
  }
  .history-block .h-year{
    font-size:11.5px;
    font-weight:500;
    color:var(--teal);
    margin-right:6px;
  }
  .history-block.amber .h-year{ color:var(--amber); }
  .history-block .h-blurb{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
  }
  .history-block.amber .h-title{ color:var(--amber); }

  .works-block{
    border-top:1px solid var(--line-soft);
    padding-top:14px;
    flex:1;
    min-height:100px;
  }
  #worksList{ list-style:none; margin:0; padding:0; }
  #worksList li{
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
    font-size:13px;
    color:var(--text);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    transition:color .15s;
  }
  #worksList li:last-child{ border-bottom:none; }
  #worksList li:hover{ color:var(--teal); }
  #worksList .empty-msg{
    color:var(--text-faint);
    font-size:12.5px;
    cursor:default;
  }
  #worksList .empty-msg:hover{ color:var(--text-faint); }
  #worksList .w-type{
    font-size:11px;
    color:var(--text-faint);
    flex-shrink:0;
    margin-left:8px;
  }

  /* ---------- Timeline (waveform) ---------- */
  .timeline{
    margin-top:24px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 22px 14px;
    position:relative;
  }
  .waveform{
    display:flex;
    align-items:flex-end;
    height:34px;
    gap:2px;
    margin-bottom:10px;
    pointer-events:none;
  }
  .waveform .bar{
    flex:1;
    background:var(--line);
    border-radius:1px;
    transition:background .15s;
  }
  .waveform .bar.past{ background:var(--teal-dim); }
  .slider-wrap{ position:relative; height:0; }
  #yearSlider{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    height:34px;
    background:transparent;
    outline:none;
    position:relative;
    top:-44px;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:44px;
    border-radius:3px;
    background:var(--teal);
    box-shadow:0 0 12px rgba(47,243,199,.7);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:14px; height:44px;
    border:none;
    border-radius:3px;
    background:var(--teal);
    box-shadow:0 0 12px rgba(47,243,199,.7);
    cursor:pointer;
  }
  #yearSlider::-moz-range-track{ background:transparent; height:44px; }
  .era-ticks{
    position:relative;
    height:18px;
    font-size:11px;
    color:var(--text-faint);
  }
  .era-ticks span{
    position:absolute;
    transform:translateX(-50%);
    white-space:nowrap;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(4,5,7,.72);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    padding:24px 26px 22px;
  }
  .modal h2{
    font-family:'Black Han Sans',sans-serif;
    font-weight:400;
    font-size:20px;
    margin:0 0 18px 0;
    color:var(--text);
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 11px;
    font-size:13.5px;
    font-family:'Noto Sans KR',sans-serif;
    background:#0F1116;
    color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;
    border-color:var(--teal-dim);
  }
  .field textarea{ resize:vertical; min-height:52px; }
  .row2{ display:flex; gap:8px; }
  .row2 > div{ flex:1; }
  .year-input-group{ display:flex; gap:6px; }
  .year-input-group input{ flex:2; }
  .year-input-group select{ flex:1; }
  .place-btn{
    width:100%;
    background:#0F1116;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:10px;
    font-size:13px;
    cursor:pointer;
    color:var(--text-dim);
    font-family:'Noto Sans KR',sans-serif;
  }
  .place-btn.set{ background:rgba(47,243,199,.1); color:var(--teal); border:1px solid var(--teal-dim); }
  .modal-actions{
    display:flex; gap:8px; margin-top:20px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    border:1px solid var(--line);
  }
  .btn-cancel{ background:transparent; color:var(--text-dim); }
  .btn-save{ background:var(--teal); color:#062019; border-color:var(--teal); font-weight:700; }
  .btn-danger{ background:transparent; color:#E15B5B; border-color:#5A2E2E; }
  .field-error{ font-size:11.5px; color:#E15B5B; margin-top:5px; display:none; }

  /* ---------- Detail panel ---------- */
  .detail-period{
    display:inline-block;
    background:rgba(47,243,199,.1);
    border:1px solid var(--teal-dim);
    border-radius:20px;
    padding:4px 12px;
    font-size:12px;
    color:var(--teal);
    margin-bottom:12px;
  }
  .detail-loc{ font-size:13px; color:var(--text-dim); margin-bottom:10px; }
  .detail-note{ font-size:13.5px; line-height:1.65; color:var(--text); margin-bottom:18px; }
  .detail-creator{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="title-block">
      <h1>이야기 지리지</h1>
      <p>문학과 영화 속 시공간을, 세계사·한국사 위에 놓다</p>
    </div>
    <div class="controls">
      <div class="map-toggle">
        <button id="btnWorldMap" class="active">세계지도</button>
        <button id="btnKoreaMap">한국지도</button>
      </div>
      <button class="add-btn" id="openAddBtn">+ 작품 추가</button>
    </div>
  </header>

  <div class="main">
    <div class="map-panel" id="mapPanel">
      <svg id="mapSvg" viewBox="0 0 1000 500"></svg>
      <div class="placement-hint hidden" id="placementHint">지도를 클릭해 위치를 지정하세요</div>
    </div>

    <div class="sidebar">
      <div class="year-hero">
        <div class="year-num" id="yearNum">1400</div>
        <div class="era-name" id="eraName"></div>
      </div>

      <div>
        <div class="history-block">
          <div class="divider-label">세계사</div>
          <div class="h-title" id="worldHTitle"></div>
          <div class="h-blurb" id="worldHBlurb"></div>
        </div>
        <div class="history-block amber">
          <div class="divider-label">한국사</div>
          <div class="h-title" id="koreaHTitle"></div>
          <div class="h-blurb" id="koreaHBlurb"></div>
        </div>
      </div>

      <div class="works-block">
        <div class="divider-label">이 시대의 작품</div>
        <ul id="worksList"></ul>
      </div>
    </div>
  </div>

  <div class="timeline">
    <div class="waveform" id="waveform"></div>
    <div class="slider-wrap">
      <input type="range" id="yearSlider" min="-3000" max="2026" value="1400" step="1">
    </div>
    <div class="era-ticks" id="eraTicks"></div>
  </div>

</div>

<!-- Add work modal -->
<div class="modal-overlay hidden" id="addOverlay">
  <div class="modal">
    <h2>새 작품 추가</h2>
    <div class="field">
      <label>제목</label>
      <input type="text" id="fTitle" placeholder="예: 메밀꽃 필 무렵">
    </div>
    <div class="row2">
      <div class="field">
        <label>유형</label>
        <select id="fType">
          <option>소설</option>
          <option>시</option>
          <option>희곡</option>
          <option>영화</option>
          <option>드라마</option>
          <option>수필/일기</option>
          <option>기타</option>
        </select>
      </div>
      <div class="field">
        <label>지도</label>
        <select id="fMap">
          <option value="world">세계지도</option>
          <option value="korea">한국지도</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>지은이 / 감독</label>
      <input type="text" id="fCreator" placeholder="예: 이효석">
    </div>
    <div class="field">
      <label>배경 시작 연도</label>
      <div class="year-input-group">
        <input type="number" id="fYearStart" placeholder="예: 1925">
        <select id="fYearStartEra"><option value="AD">서기(AD)</option><option value="BC">기원전(BC)</option></select>
      </div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="fHasEnd" style="width:auto;margin-right:6px;">종료 연도가 따로 있음</label>
      <div class="year-input-group" id="fYearEndGroup" style="margin-top:6px;display:none;">
        <input type="number" id="fYearEnd" placeholder="예: 1953">
        <select id="fYearEndEra"><option value="AD">서기(AD)</option><option value="BC">기원전(BC)</option></select>
      </div>
    </div>
    <div class="field">
      <label>배경 장소</label>
      <input type="text" id="fLocation" placeholder="예: 강원도 봉평">
    </div>
    <div class="field">
      <button type="button" class="place-btn" id="fPlaceBtn">지도에서 위치 지정하기</button>
      <div class="field-error" id="fCoordError">지도를 클릭해 위치를 먼저 찍어주세요.</div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fNote" placeholder="이 작품을 왜 여기 두는지, 짧은 메모"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="fCancelBtn">취소</button>
      <button class="btn-save" id="fSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay hidden" id="detailOverlay">
  <div class="modal" id="detailModalBody"></div>
</div>

<script>
(function(){

  // ---------------- Static reference data ----------------
  var MIN_YEAR = -3000, MAX_YEAR = 2026;

  var WORLD_ERAS = [
    {year:-3000, label:'선사·고대 문명'},
    {year:-800,  label:'고대'},
    {year:500,   label:'중세'},
    {year:1500,  label:'근세'},
    {year:1800,  label:'근대'},
    {year:1945,  label:'현대'}
  ];
  var KOREA_ERAS = [
    {year:-2333, label:'고조선'},
    {year:-100,  label:'삼국시대'},
    {year:668,   label:'남북국시대'},
    {year:918,   label:'고려'},
    {year:1392,  label:'조선'},
    {year:1910,  label:'일제강점기'},
    {year:1945,  label:'현대'}
  ];

  var WORLD_HISTORY = [
    {year:-3000, title:'메소포타미아·이집트 문명', blurb:'수메르 도시국가와 이집트 초기 왕조가 형성되던 시기.'},
    {year:-1200, title:'지중해 청동기 문명 말기', blurb:'트로이 전쟁의 배경이 되는 청동기 시대 후기.'},
    {year:-500,  title:'그리스 고전기', blurb:'아테네 민주정과 페르시아 전쟁의 시대.'},
    {year:-27,   title:'로마 제국 성립', blurb:'아우구스투스가 로마 제정을 열다.'},
    {year:313,   title:'기독교 공인', blurb:'로마 제국이 기독교를 받아들이기 시작하다.'},
    {year:476,   title:'서로마 제국 멸망', blurb:'유럽 중세의 시작으로 보는 분기점.'},
    {year:800,   title:'카롤루스 대관', blurb:'서유럽 중세 왕권 질서가 형성되다.'},
    {year:1096,  title:'십자군 전쟁 시작', blurb:'유럽과 이슬람 세계가 충돌하다.'},
    {year:1347,  title:'흑사병 유행', blurb:'유럽 인구의 상당수가 페스트로 희생되다.'},
    {year:1453,  title:'동로마 제국 멸망', blurb:'오스만 제국이 콘스탄티노폴리스를 점령, 중세가 저물다.'},
    {year:1492,  title:'대항해시대 개막', blurb:'콜럼버스가 아메리카에 도달하다.'},
    {year:1517,  title:'종교개혁', blurb:'루터의 문제 제기로 유럽 기독교 세계가 갈라지다.'},
    {year:1789,  title:'프랑스 대혁명', blurb:'근대 시민사회의 출발점.'},
    {year:1804,  title:'나폴레옹 제정', blurb:'프랑스가 유럽 질서를 재편하다.'},
    {year:1861,  title:'미국 남북전쟁', blurb:'노예제를 둘러싼 미국의 내전.'},
    {year:1914,  title:'제1차 세계대전', blurb:'유럽 열강이 전면전에 돌입하다.'},
    {year:1929,  title:'세계 대공황', blurb:'자본주의 세계 경제가 붕괴하다.'},
    {year:1939,  title:'제2차 세계대전', blurb:'인류사 최대 규모의 전쟁이 시작되다.'},
    {year:1945,  title:'2차대전 종전·냉전 개막', blurb:'세계가 미·소 양 진영으로 재편되다.'},
    {year:1969,  title:'인류 최초 달 착륙', blurb:'냉전 시대 우주 경쟁의 정점.'},
    {year:1989,  title:'베를린 장벽 붕괴', blurb:'냉전 질서가 막을 내리다.'},
    {year:2001,  title:'9·11 테러', blurb:'21세기 국제 질서를 뒤흔들다.'},
    {year:2020,  title:'코로나19 팬데믹', blurb:'전 지구적 감염병이 확산되다.'}
  ];

  // 클로드 아티팩트 안에서는 window.storage를, GitHub 등 바깥 호스팅에서는
  // 브라우저 localStorage를 자동으로 사용하는 저장소 어댑터
  var storageAdapter = {
    hasClaudeStorage: (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function'),
    async get(key){
      if(this.hasClaudeStorage){
        return await window.storage.get(key, false);
      }
      var v = localStorage.getItem(key);
      if(v === null) throw new Error('키가 존재하지 않음');
      return {key:key, value:v, shared:false};
    },
    async set(key, value){
      if(this.hasClaudeStorage){
        return await window.storage.set(key, value, false);
      }
      localStorage.setItem(key, value);
      return {key:key, value:value, shared:false};
    }
  };

      var res = await storageAdapter.get(STORAGE_KEY);
      state.works = res && res.value ? JSON.parse(res.value) : SEED_WORKS.slice();
    }catch(e){
      state.works = SEED_WORKS.slice();
      try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state.works)); }catch(e2){}
    }
    renderAll();

  // ---------------- Helpers ----------------
  function formatYear(y){
    if(y < 0) return '기원전 ' + Math.abs(y) + '년';
    return y + '년';
  }
  function periodLabel(work){
    if(work.yearEnd && work.yearEnd !== work.yearStart){
      return formatYear(work.yearStart) + ' ~ ' + formatYear(work.yearEnd);
    }
    return formatYear(work.yearStart) + ' 무렵';
  }
  function eraForYear(list, year){
    var found = list[0];
    for(var i=0;i<list.length;i++){
      if(list[i].year <= year) found = list[i];
    }
    return found;
  }
  function historyContextForYear(list, year){
    var found = list[0];
    for(var i=0;i<list.length;i++){
      if(list[i].year <= year) found = list[i];
    }
    return found;
  }
  function isActive(work, year){
    var start = work.yearStart, end = (work.yearEnd!=null? work.yearEnd : work.yearStart);
    return year >= (start-15) && year <= (end+15);
  }
  function pct(year){
    return (year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  }

    el.appendChild(yearSpan);
    el.appendChild(document.createTextNode(entry.title));
  }

  function buildSvg(){
    var svg = document.getElementById('mapSvg');
    svg.innerHTML = '';
    var isWorld = state.currentMap === 'world';
    svg.setAttribute('viewBox', isWorld ? '0 0 1000 500' : '0 0 400 600');
    document.getElementById('mapPanel').classList.toggle('korea-mode', !isWorld);

    var ns = 'http://www.w3.org/2000/svg';

    var defs = document.createElementNS(ns,'defs');
    var filter = document.createElementNS(ns,'filter');
    filter.setAttribute('id','landGlow');
    filter.setAttribute('x','-40%'); filter.setAttribute('y','-40%');
    filter.setAttribute('width','180%'); filter.setAttribute('height','180%');
    var blur = document.createElementNS(ns,'feGaussianBlur');
    blur.setAttribute('stdDeviation','3');
    blur.setAttribute('result','blur');
    filter.appendChild(blur);
    var merge = document.createElementNS(ns,'feMerge');
    var m1 = document.createElementNS(ns,'feMergeNode'); m1.setAttribute('in','blur');
    var m2 = document.createElementNS(ns,'feMergeNode'); m2.setAttribute('in','SourceGraphic');
    merge.appendChild(m1); merge.appendChild(m2);
    filter.appendChild(merge);
    defs.appendChild(filter);
    svg.appendChild(defs);

    // faint lat/long grid
    var gridGroup = document.createElementNS(ns,'g');
    gridGroup.setAttribute('stroke', '#1B2530');
    gridGroup.setAttribute('stroke-width','0.6');
    var w = isWorld?1000:400, h = isWorld?500:600;
    var step = isWorld?100:75;
    for(var gx=0; gx<=w; gx+=step){
      var l1 = document.createElementNS(ns,'line');
      l1.setAttribute('x1',gx); l1.setAttribute('y1',0);
      l1.setAttribute('x2',gx); l1.setAttribute('y2',h);
      gridGroup.appendChild(l1);
    }
    for(var gy=0; gy<=h; gy+=step){
      var l2 = document.createElementNS(ns,'line');
      l2.setAttribute('x1',0); l2.setAttribute('y1',gy);
      l2.setAttribute('x2',w); l2.setAttribute('y2',gy);
      gridGroup.appendChild(l2);
    }
    svg.appendChild(gridGroup);

    // land (glowing parchment against dark sea)
    var landPaths = isWorld ? WORLD_LAND : KOREA_LAND;
    var landGroup = document.createElementNS(ns,'g');
    landGroup.setAttribute('filter','url(#landGlow)');
    landPaths.forEach(function(d){
      var p = document.createElementNS(ns,'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', 'var(--map-land)');
      p.setAttribute('fill-opacity','0.14');
      p.setAttribute('stroke', 'var(--map-land)');
      p.setAttribute('stroke-width', '1.3');
      p.setAttribute('stroke-opacity','0.85');
      p.setAttribute('stroke-linejoin','round');
      landGroup.appendChild(p);
    });
    if(!isWorld){
      var jeju = document.createElementNS(ns,'circle');
      jeju.setAttribute('cx', KOREA_JEJU.x);
      jeju.setAttribute('cy', KOREA_JEJU.y);
      jeju.setAttribute('r', KOREA_JEJU.r);
      jeju.setAttribute('fill','var(--map-land)');
      jeju.setAttribute('fill-opacity','0.14');
      jeju.setAttribute('stroke','var(--map-land)');
      jeju.setAttribute('stroke-opacity','0.85');
      jeju.setAttribute('stroke-width','1.3');
      landGroup.appendChild(jeju);
    }
    svg.appendChild(landGroup);

    // labels
    var labels = isWorld ? WORLD_LABELS : KOREA_LABELS;
    labels.forEach(function(lb){
      var t = document.createElementNS(ns,'text');
      t.setAttribute('x', lb.x); t.setAttribute('y', lb.y);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size', isWorld?11:10.5);
      t.setAttribute('fill', '#6A6E7A');
      t.setAttribute('font-family',"'Noto Sans KR',sans-serif");
      t.textContent = lb.t;
      svg.appendChild(t);
    });

    svg.onclick = function(evt){
      if(!state.placing) return;
      var rect = svg.getBoundingClientRect();
      var vb = svg.viewBox.baseVal;
      var x = (evt.clientX - rect.left) / rect.width * vb.width;
      var y = (evt.clientY - rect.top) / rect.height * vb.height;
      state.pendingCoord = {x: Math.round(x), y: Math.round(y)};
      var btn = document.getElementById('fPlaceBtn');
      btn.textContent = '위치 지정됨 · 다시 클릭해 변경';
      btn.classList.add('set');
      document.getElementById('fCoordError').style.display = 'none';
      state.placing = false;
      svg.classList.remove('placing');
      document.getElementById('placementHint').classList.add('hidden');
    };

    renderPins();
  }

  function renderPins(){
    var svg = document.getElementById('mapSvg');
    var old = svg.querySelectorAll('.pin');
    old.forEach(function(n){ n.remove(); });
    var ns = 'http://www.w3.org/2000/svg';
    var worksOnMap = state.works.filter(function(w){ return w.map === state.currentMap; });

    worksOnMap.forEach(function(w){
      var active = isActive(w, state.year);
      var g = document.createElementNS(ns,'g');
      g.setAttribute('class','pin');
      g.setAttribute('transform', 'translate('+w.x+','+w.y+')');

      if(active){
        var ring = document.createElementNS(ns,'circle');
        ring.setAttribute('r','9');
        ring.setAttribute('fill','none');
        ring.setAttribute('stroke','var(--teal)');
        ring.setAttribute('stroke-width','1.5');
        ring.style.animation = 'pinPulse 2.2s ease-out infinite';
        g.appendChild(ring);
      }

      var c = document.createElementNS(ns,'circle');
      c.setAttribute('class','dot');
      c.setAttribute('r', active ? 5.5 : 3);
      c.setAttribute('fill', active ? 'var(--teal)' : '#4A4D57');
      c.setAttribute('opacity', active? '1':'0.6');
      if(active){ c.style.filter = 'drop-shadow(0 0 6px rgba(47,243,199,.9))'; }
      g.appendChild(c);

      if(active){
        var t = document.createElementNS(ns,'text');
        t.setAttribute('x', 10);
        t.setAttribute('y', 4);
        t.textContent = w.title;
        g.appendChild(t);
      }

      g.onclick = function(evt){
        evt.stopPropagation();
        openDetail(w);
      };
      svg.appendChild(g);
    });
  }

    document.getElementById('eraName').textContent = eraForYear(eraList, state.year).label;

    var wh = historyContextForYear(WORLD_HISTORY, state.year);
    var kh = historyContextForYear(KOREA_HISTORY, state.year);

    renderHistoryTitle('koreaHTitle', kh);
    document.getElementById('koreaHBlurb').textContent = kh.blurb;

    var list = document.getElementById('worksList');
    list.innerHTML = '';
    var active = state.works.filter(function(w){
      return w.map === state.currentMap && isActive(w, state.year);
    });
    if(active.length === 0){
      var li = document.createElement('li');
      li.className = 'empty-msg';
      li.textContent = '이 시대에 걸린 작품이 아직 없어요.';
      list.appendChild(li);
    }else{
      active.forEach(function(w){
        var li = document.createElement('li');
        var span1 = document.createElement('span');
        span1.textContent = w.title;
        li.appendChild(span1);
        var sp = document.createElement('span');
        sp.className = 'w-type';
        sp.textContent = w.type;
        li.appendChild(sp);
        li.onclick = function(){ openDetail(w); };
        list.appendChild(li);
      });
    }
  }

  function renderEraTicks(){
    var eraList = state.currentMap === 'world' ? WORLD_ERAS : KOREA_ERAS;
    var box = document.getElementById('eraTicks');
    box.innerHTML = '';
    eraList.forEach(function(e){
      var span = document.createElement('span');
      span.style.left = pct(e.year) + '%';
      span.textContent = e.label;
      box.appendChild(span);
    });
  }

  function renderWaveform(){
    var box = document.getElementById('waveform');
    box.innerHTML = '';
    var barCount = 90;
    var curPct = pct(state.year);
    // deterministic pseudo-random heights (seeded by index) for a stable waveform look
    for(var i=0;i<barCount;i++){
      var seed = Math.sin(i*12.9898)*43758.5453;
      var frac = seed - Math.floor(seed);
      var h = 6 + frac*26;
      var bar = document.createElement('div');
      bar.className = 'bar' + ((i/barCount*100) <= curPct ? ' past' : '');
      bar.style.height = h + 'px';
      box.appendChild(bar);
    }
  }

  function renderAll(){
    buildSvg();
    renderSidebar();
    renderEraTicks();
    renderWaveform();
  }

  // ---------------- Detail modal ----------------
  function openDetail(w){
    var body = document.getElementById('detailModalBody');
    body.innerHTML = '';

    var h2 = document.createElement('h2');
    h2.textContent = w.title;
    body.appendChild(h2);

    var creator = document.createElement('div');
    creator.className = 'detail-creator';
    creator.textContent = (w.creator || '작자 미상') + ' · ' + w.type;
    body.appendChild(creator);

    var period = document.createElement('div');
    period.className = 'detail-period';
    period.textContent = periodLabel(w);
    body.appendChild(period);

    var loc = document.createElement('div');
    loc.className = 'detail-loc';
    loc.textContent = '배경: ' + w.location;
    body.appendChild(loc);

    if(w.note){
      var note = document.createElement('div');
      note.className = 'detail-note';
      note.textContent = w.note;
      body.appendChild(note);
    }

    var actions = document.createElement('div');
    actions.className = 'modal-actions';

    var jumpBtn = document.createElement('button');
    jumpBtn.className = 'btn-cancel';
    jumpBtn.textContent = '이 시대로 이동';
    jumpBtn.onclick = function(){
      state.year = w.yearStart;
      document.getElementById('yearSlider').value = w.yearStart;
      renderAll();
      closeDetail();
    };
    actions.appendChild(jumpBtn);

    var delBtn = document.createElement('button');
    delBtn.className = 'btn-danger';
    delBtn.textContent = '삭제';
    delBtn.onclick = function(){
      if(confirm('"' + w.title + '"을(를) 삭제할까요?')){
        state.works = state.works.filter(function(x){ return x.id !== w.id; });
        saveWorks();
        renderAll();
        closeDetail();
      }
    };
    actions.appendChild(delBtn);

    body.appendChild(actions);
    document.getElementById('detailOverlay').classList.remove('hidden');
  }
  function closeDetail(){
    document.getElementById('detailOverlay').classList.add('hidden');
  }

  // ---------------- Add-work modal ----------------
  function openAddModal(){
    document.getElementById('fTitle').value = '';
    document.getElementById('fType').value = '소설';
    document.getElementById('fMap').value = state.currentMap;
    document.getElementById('fCreator').value = '';
    document.getElementById('fYearStart').value = '';
    document.getElementById('fYearStartEra').value = 'AD';
    document.getElementById('fHasEnd').checked = false;
    document.getElementById('fYearEndGroup').style.display = 'none';
    document.getElementById('fYearEnd').value = '';
    document.getElementById('fYearEndEra').value = 'AD';
    document.getElementById('fLocation').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('fPlaceBtn').textContent = '지도에서 위치 지정하기';
    document.getElementById('fPlaceBtn').classList.remove('set');
    document.getElementById('fCoordError').style.display = 'none';
    state.pendingCoord = null;
    state.placing = false;
    document.getElementById('addOverlay').classList.remove('hidden');
  }
  function closeAddModal(){
    document.getElementById('addOverlay').classList.add('hidden');
    state.placing = false;
    document.getElementById('mapSvg').classList.remove('placing');
    document.getElementById('placementHint').classList.add('hidden');
  }

  function signedYear(val, era){
    var n = parseInt(val, 10);
    if(isNaN(n)) return null;
    return era === 'BC' ? -Math.abs(n) : Math.abs(n);
  }

  async function handleSave(){
    var title = document.getElementById('fTitle').value.trim();
    var type = document.getElementById('fType').value;
    var map = document.getElementById('fMap').value;
    var creator = document.getElementById('fCreator').value.trim();
    var yearStart = signedYear(document.getElementById('fYearStart').value, document.getElementById('fYearStartEra').value);
    var hasEnd = document.getElementById('fHasEnd').checked;
    var yearEnd = hasEnd ? signedYear(document.getElementById('fYearEnd').value, document.getElementById('fYearEndEra').value) : null;
    var location = document.getElementById('fLocation').value.trim();
    var note = document.getElementById('fNote').value.trim();

    if(!title || yearStart === null || !state.pendingCoord || map !== state.currentMap){
      if(!state.pendingCoord || map !== state.currentMap){
        document.getElementById('fCoordError').style.display = 'block';
        document.getElementById('fCoordError').textContent = (map !== state.currentMap)
          ? '지도를 "' + (map==='world'?'세계지도':'한국지도') + '"로 바꾼 뒤 위치를 다시 지정해주세요.'
          : '지도를 클릭해 위치를 먼저 찍어주세요.';
        return;
      }
      if(!title){ alert('제목을 입력해주세요.'); return; }
      if(yearStart === null){ alert('배경 시작 연도를 입력해주세요.'); return; }
    }

    var w = {
      id: 'w' + Date.now(),
      map: map,
      title: title,
      type: type,
      creator: creator,
      yearStart: yearStart,
      yearEnd: yearEnd,
      location: location,
      note: note,
      x: state.pendingCoord.x,
      y: state.pendingCoord.y
    };
    state.works.push(w);
    await saveWorks();
    closeAddModal();
    renderAll();
  }

  // ---------------- Event wiring ----------------
  document.getElementById('btnWorldMap').onclick = function(){
    state.currentMap = 'world';
    this.classList.add('active');
    document.getElementById('btnKoreaMap').classList.remove('active');
    renderAll();
  };
  document.getElementById('btnKoreaMap').onclick = function(){
    state.currentMap = 'korea';
    this.classList.add('active');
    document.getElementById('btnWorldMap').classList.remove('active');
    renderAll();
  };
  document.getElementById('yearSlider').oninput = function(){
    state.year = parseInt(this.value, 10);
    renderSidebar();
    renderPins();
    renderWaveform();
  };
  document.getElementById('openAddBtn').onclick = openAddModal;
  document.getElementById('fCancelBtn').onclick = closeAddModal;
  document.getElementById('fSaveBtn').onclick = handleSave;
  document.getElementById('fHasEnd').onchange = function(){
    document.getElementById('fYearEndGroup').style.display = this.checked ? 'flex' : 'none';
  };
  document.getElementById('fPlaceBtn').onclick = function(){
    var fMap = document.getElementById('fMap').value;
    if(fMap !== state.currentMap){
      alert('먼저 상단에서 "' + (fMap==='world'?'세계지도':'한국지도') + '"로 전환한 뒤 위치를 지정해주세요.');
      return;
    }
    state.placing = true;
    document.getElementById('mapSvg').classList.add('placing');
    document.getElementById('placementHint').classList.remove('hidden');
    document.getElementById('addOverlay').classList.add('hidden');
  };
  document.getElementById('mapSvg').addEventListener('click', function(){
    if(state.pendingCoord && !state.placing){
      document.getElementById('addOverlay').classList.remove('hidden');
    }
  });
  document.getElementById('detailOverlay').onclick = function(e){
    if(e.target === this) closeDetail();
  };
  document.getElementById('addOverlay').onclick = function(e){
    if(e.target === this && !state.placing) closeAddModal();
  };

  // init
  loadWorks();

})();
</script>
</body>
</html>
